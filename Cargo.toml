[package]
name = "ais_gitmon"
version = "2.5.0"
edition = "2021"

[dependencies]
#artisan_middleware = "5.6.3"
artisan_middleware = {path = "/opt/artisan/lib/artisan_lib"}
config = "0.15.25"
serde = "1.0.228"
serde_json = "1.0.128"
toml = "1.1.3+spec-1.1.0"
tokio = "1.53.0"
rng = "0.1.0"
rand = "0.10.2"
colored = "3.1.1"
signals = "0.0.5"
signal-hook = "0.4.4"
once_cell = "1.21.4"
base64 = "0.22.1"

[dev-dependencies]
tempfile = "3.14.0"
serial_test = "3.2.0"
tiny_http = "0.12.0"

[[bin]]
name = "ais_gitmon"
path = "src/application/main.rs"

[[bin]]
name = "cli_credential"
path = "src/cli/main.rs"
